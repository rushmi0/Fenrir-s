name: CI/CD

on:
  push:
    branches: [main, master, v2.0]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show build context
        run: |
          echo "ref=${{ github.ref }} sha=${{ github.sha }}"
          git rev-parse HEAD
          git log -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test -Dorg.gradle.java.home="$JAVA_HOME"

  build-jvm:
    name: JVM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Show build context
        run: |
          echo "ref=${{ github.ref }} sha=${{ github.sha }}"
          git rev-parse HEAD
          git log -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - uses: extractions/setup-just@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Fenrir-client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: Fenrir-client

      - name: Build shadow jar
        run: just build-client build-jvm

      - uses: actions/upload-artifact@v4
        with:
          name: Fenrir-s-jvm-jar
          path: build/libs/*-jvm.jar
          if-no-files-found: error


  build-native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: windows-latest
            name: windows-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Show build context
        shell: bash
        run: |
          echo "ref=${{ github.ref }} sha=${{ github.sha }}"
          git rev-parse HEAD
          git log -1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Fenrir-client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: Fenrir-client

      - name: Build client assets
        shell: bash
        run: |
          npm run build --prefix Fenrir-client
          rm -rf src/main/resources/public/assets
          cp -r Fenrir-client/dist/. src/main/resources/public/

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install static zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - uses: gradle/actions/setup-gradle@v4

      - name: Build native image
        shell: bash
        run: ./gradlew nativeOptimizedCompile -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Collect binary and shared libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          binary=$(find build/native/nativeOptimizedCompile -maxdepth 1 -type f -name '*-relay-*' ! -name '*.txt')
          cp "$binary" build/native/nativeOptimizedCompile/build-output.json dist/
          ldd "$binary" | while read -r line; do
            if [[ "$line" == *"=>"* ]]; then
              path=$(awk '{print $3}' <<< "$line")
            else
              path=$(awk '{print $1}' <<< "$line")
            fi
            [[ "$path" == /* ]] && cp -n "$path" dist/ || true
          done
          # native-image also drops JNI libs (e.g. netty-transport-native-epoll) straight into
          # its output dir; these aren't linked deps of the binary, so ldd won't see them.
          find build/native/nativeOptimizedCompile -maxdepth 1 -type f -name '*.so*' -exec cp -n {} dist/ \;

      - name: Add Termux scripts (linux-arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          cp termux/*.sh dist/
          chmod +x dist/*.sh

      - name: Collect binary and runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $binary = Get-ChildItem -Path build/native/nativeOptimizedCompile -Filter '*-relay-*.exe' | Select-Object -First 1
          Copy-Item $binary.FullName, build/native/nativeOptimizedCompile/build-output.json -Destination dist
          foreach ($dll in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','ucrtbase.dll') {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src -Destination dist -Force }
          }
          # native-image also drops JNI libs straight into its output dir; grab any of those too.
          Get-ChildItem -Path build/native/nativeOptimizedCompile -Filter '*.dll' | Copy-Item -Destination dist -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Fenrir-s-native-${{ matrix.name }}
          path: dist
          if-no-files-found: error


  build-native-musl:
    name: Native musl (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
#          - os: ubuntu-24.04-arm
#            name: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Show build context
        shell: bash
        run: |
          echo "ref=${{ github.ref }} sha=${{ github.sha }}"
          git rev-parse HEAD
          git log -1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Fenrir-client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: Fenrir-client

      - name: Build client assets
        shell: bash
        run: |
          npm run build --prefix Fenrir-client
          rm -rf src/main/resources/public/assets
          cp -r Fenrir-client/dist/. src/main/resources/public/

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static zlib for musl
        run: |
          curl -fsSL https://zlib.net/fossils/zlib-1.3.1.tar.gz -o /tmp/zlib.tar.gz
          mkdir -p /tmp/zlib
          tar -xzf /tmp/zlib.tar.gz -C /tmp/zlib --strip-components=1
          cd /tmp/zlib
          CC=musl-gcc ./configure --static --prefix=/tmp/musl-extra
          make -j"$(nproc)"
          make install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build musl-static native image
        shell: bash
        run: |
          ./gradlew nativeOptimizedCompile \
            -PmuslStatic=true \
            -PextraLibDir=/tmp/musl-extra/lib \
            -Dorg.gradle.java.home="$JAVA_HOME"
        env:
          CC: musl-gcc

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist
          binary=$(find build/native/nativeOptimizedCompile -maxdepth 1 -type f -name '*-relay-*' ! -name '*.txt')
          cp "$binary" build/native/nativeOptimizedCompile/build-output.json dist/
          find build/native/nativeOptimizedCompile -maxdepth 1 -type f -name '*.so*' -exec cp -n {} dist/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: Fenrir-s-native-musl-${{ matrix.name }}
          path: dist
          if-no-files-found: error


  build-native-bionic:
    name: Native Bionic
    runs-on: ${{ matrix.os }}
    needs: test
    continue-on-error: true
    env:
      ANDROID_BIONIC_STATIC_LIBS_URL: ${{ secrets.ANDROID_BIONIC_STATIC_LIBS_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # nttld/setup-ndk only ships host binaries for linux-x64, win32-x64,
          # darwin-arm64, darwin-x64 (Google doesn't publish a linux-aarch64 NDK
          # host toolchain), so this must run on an x86_64 runner. The NDK's
          # cross-compiler still targets arm64 Android from here.
          - os: ubuntu-latest
            name: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Show build context
        shell: bash
        run: |
          echo "ref=${{ github.ref }} sha=${{ github.sha }}"
          git rev-parse HEAD
          git log -1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Fenrir-client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: Fenrir-client

      - name: Build client assets
        shell: bash
        run: |
          npm run build --prefix Fenrir-client
          rm -rf src/main/resources/public/assets
          cp -r Fenrir-client/dist/. src/main/resources/public/

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      # Optional: set the ANDROID_BIONIC_STATIC_LIBS_URL repo secret to a .tar.gz of a bionic
      # static-libs bundle once one exists (e.g. built from openjdk/mobile via
      # `make static-libs-image` for an aarch64-bionic target - as of writing, GraalVM's own
      # labs-openjdk releases (https://github.com/graalvm/labs-openjdk/releases) ship no bionic
      # asset at all, only amd64/amd64_musl/aarch64/riscv64/darwin/windows).
      #
      # native-image looks for these JDK-internal static libs (libjava.a, libnio.a, libnet.a)
      # inside the GraalVM install itself, at lib/static/<arch>/<libc> - NOT via -H:CLibraryPath
      # (that flag only locates target *C* libraries like libc.so/libm.so, which is a separate
      # requirement). So the bundle's .a files are copied straight into that exact directory;
      # anything left over (e.g. a static zlib) is still handed to CLibraryPath.
      - name: Fetch bionic static JDK libs (if available)
        id: fetch-bionic-libs
        if: env.ANDROID_BIONIC_STATIC_LIBS_URL != ''
        shell: bash
        run: |
          mkdir -p /tmp/bionic-static-libs
          curl -fsSL "$ANDROID_BIONIC_STATIC_LIBS_URL" -o /tmp/bionic-libs.tar.gz
          tar -xzf /tmp/bionic-libs.tar.gz -C /tmp/bionic-static-libs

          target="$JAVA_HOME/lib/static/linux-amd64/bionic"
          mkdir -p "$target"
          find /tmp/bionic-static-libs -name 'lib*.a' -exec cp -n {} "$target/" \;

          if [ -f "$target/libjava.a" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_BIONIC_STATIC_LIBS_URL bundle is missing libjava.a - native-image requires it for --libc=bionic. Skipping the bionic build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build bionic native image
        if: steps.fetch-bionic-libs.outputs.available == 'true'
        shell: bash
        run: |
          ./gradlew nativeAndroidBuild \
            -PandroidNdkHome="${{ steps.setup-ndk.outputs.ndk-path }}" \
            -PextraLibDir=/tmp/bionic-static-libs \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Skip bionic build (static JDK libs unavailable)
        if: steps.fetch-bionic-libs.outputs.available != 'true'
        shell: bash
        run: |
          echo "::notice::Skipping native Bionic build - GraalVM publishes no static JDK libraries (libjava/libnio/libnet) for the bionic libc target yet, and ANDROID_BIONIC_STATIC_LIBS_URL is not set (or its bundle is incomplete). Build one from openjdk/mobile ('make static-libs-image' targeting aarch64-bionic) and point that secret at it to enable this job."

      - name: Collect binary
        if: steps.fetch-bionic-libs.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p dist
          binary=$(find build/native/nativeOptimizedCompile -maxdepth 1 -type f -name '*-relay-*' ! -name '*.txt')
          cp "$binary" build/native/nativeOptimizedCompile/build-output.json dist/
          find build/native/nativeOptimizedCompile -maxdepth 1 -type f -name '*.so*' -exec cp -n {} dist/ \;

      - uses: actions/upload-artifact@v4
        if: steps.fetch-bionic-libs.outputs.available == 'true'
        with:
          name: Fenrir-s-native-bionic-${{ matrix.name }}
          path: dist
          if-no-files-found: error

