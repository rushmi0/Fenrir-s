name: CI/CD

on:
  push:
    branches: [main, master, v2.0]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test -Dorg.gradle.java.home="$JAVA_HOME"

  build-jvm:
    name: JVM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build shadow jar
        run: ./gradlew shadowJar -Dorg.gradle.java.home="$JAVA_HOME"

      - uses: actions/upload-artifact@v4
        with:
          name: fenrir-jvm-jar
          path: build/libs/*-jvm.jar
          if-no-files-found: error


  build-termux:
    name: Native static musl (linux-arm64 / Termux)
    runs-on: ubuntu-24.04-arm
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev
      - name: Build static zlib against musl
        run: |
          ZLIB=1.3.2
          curl -fLO https://zlib.net/zlib-${ZLIB}.tar.gz
          tar xf zlib-${ZLIB}.tar.gz
          cd zlib-${ZLIB}
          CC=musl-gcc ./configure --static --prefix="$HOME/musl"
          make -j"$(nproc)" && make install
      - name: Build fully static native image
        shell: bash
        run: |
          export PATH="$HOME/musl/bin:$PATH"
          export CFLAGS="-I$HOME/musl/include"
          export LDFLAGS="-L$HOME/musl/lib"
          export CC=musl-gcc
          ./gradlew nativeOptimizedCompile -PmuslStatic=true \
            -Dorg.gradle.java.home="$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: fenrir-native-linux-arm64-termux
          path: |
            build/native/nativeOptimizedCompile/*-relay-*
            build/native/nativeOptimizedCompile/build-output.json
            !build/native/nativeOptimizedCompile/*.txt
          if-no-files-found: error

  build-native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: windows-latest
            name: windows-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install static zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - uses: gradle/actions/setup-gradle@v4

      - name: Build native image
        shell: bash
        run: ./gradlew nativeOptimizedCompile -Dorg.gradle.java.home="$JAVA_HOME"

      - uses: actions/upload-artifact@v4
        with:
          name: fenrir-native-${{ matrix.name }}
          path: |
            build/native/nativeOptimizedCompile/*-relay-*
            build/native/nativeOptimizedCompile/build-output.json
            !build/native/nativeOptimizedCompile/*.txt
          if-no-files-found: error